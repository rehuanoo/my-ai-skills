      fetchAsStream('/api/chat_stream', function (data) {
        resultDiv.innerHTML += data

    async function fetchAsStream(url, callback) {
      let response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat: input.value,
        }),
      })

      if (!response.ok) {
        throw new Error('Network response was not ok ')
      }
      // 流式输出不断获取内容
      const reader = response.body.getReader()
      // 浏览器内置的解码器
      let decoder = new TextDecoder()
      let content = ''
      while (true) {
        const { done, value } = await reader.read()
        if (done) {
          break
        }
        let txt = decoder.decode(value, { stream: true })
        content += txt
        console.log(txt)
        callback(txt)
      }

      return content

    }

    function getChatStream(chat, callback) {
      return new Promise((resolve, reject) => {
        // 创建 SSE 连接，请求你的后端接口 /api/chat_stream，把用户问题传过去
        let eventSource = new EventSource('/api/chat_stream?chat=' + chat)
        let result = []
        eventSource.onmessage = function (e) {
          // console.log(e.data)
          if (e.data == '!!!finish!!!') {
            eventSource.close()
            resolve(result.join(''))
            return
          }
          if (e.data == '!!!error!!!') {
            console.log('error出错了')
            return
          }
          result.push(e.data)
          callback(e.data)
        }
      })

    }
  </script>
