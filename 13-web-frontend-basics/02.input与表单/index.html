<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form action="" method="get">
    <input type="text" placeholder="请输入账号">
    <input type="text" placeholder="请输入账号" value="账号">
    <input type="password" placeholder="请输入密码">
    <div>
      <h3>你喜欢什么颜色</h3>
      <input type="radio" name="color" value="red">红色
      <input type="radio" name="color" value="blue">蓝色
      <input type="radio" name="color" value="green">绿色
    </div>
    <div>
      <h4>你喜欢哪些城市</h4>
      <input type="checkbox" name="city" value="beijing">北京
      <input type="checkbox" name="city" value="shanghai">上海
      <input type="checkbox" name="city" value="guangzhou">广州
    </div>

    <div>
      <h4>快递重量</h4>
      <input type="range" name="weight" min="0" max="100" value="50" step="10">
    </div>
    <div>
      <h4>颜色</h4>
      <input type="color" name="color">
    </div>
    <select name="star" id="star">
      <option value="zhangsan">张三</option>
      <option value="lisi">李四</option>
      <option value="wangwu">王五</option>

    </select>
    <input type="submit" value="提交">
    <input type="button" value="按钮">
    <input type="reset" value="重置">
    <input type="file" value="上传文件">
    <input type="hidden" value="隐藏">
    <input type="image" src="https://www.baidu.com/img/flexible/logo/pc/result.png" alt="百度logo">
    <input type="image" src="https://www.baidu.com/img/flexible/logo/pc/result.png" alt="百度logo" width="100px"
      height="100px">
  </form>

</body>

</html>
