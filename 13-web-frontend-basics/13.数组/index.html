    function sumadd() {
      console.log(arguments)
      // arguments 是一个类数组对象，不是数组
      let sum = 0
      for (let i = 0; i < arguments.length; i++) {
        sum += arguments[i]
      }
      return sum

    }
    function sumadd2(...args) {
      console.log(args)
      // ...args 是一个数组
      let sum = 0
      for (let i = 0; i < args.length; i++) {
        sum += args[i]
      }
      return sum
    }
