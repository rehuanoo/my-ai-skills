<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //创建一个对象方法1
    s1 = {
      name: "张三",
      age: 18,
      sex: "男",
      say: function () {
        console.log("hello")
      }
    }
    s2 = {
      name: "张三",
      age: 18,
      sex: "男",
      say: function () {
        console.log("hello")
      }
    }
    console.log(s1)
    console.log(s2)
    console.log(s1 == s2)
    // 虽然s1和s2的内容相同，但是他们是两个不同的对象
    // 创建一个对象方法2
    function Stu() {
      this.name = "张三";
      this.age = 18;
      this.sex = "男";
      // 用;隔开
    }
    Stu.prototype.say = function () {
      console.log("hello")
    }
    var s3 = new Stu()
    var s4 = new Stu()
    console.log(s3)
    console.log(s4)
    console.log(s3.say == s4.say)

    //创建一个对象方法3,现在常用的
    class Stu2 {
      constructor(name, age, sex) {
        this.name = name;
        this.age = age;
        this.sex = sex;
      }
      say() {
        console.log("hello")
      }
    }
    var s5 = new Stu2("张三", 18, "男")
    var s6 = new Stu2("张三", 18, "男")
    console.log(s5)
    console.log(s6)
    console.log(s5.say == s6.say)



  </script>
</body>

</html>
