<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <style>
    /* h1的颜色为红色，位置居中，字体大小为40px */
    h1 {
      color: red;
      text-align: center;
      font-size: 40px;
    }

    /* h2的颜色为蓝色，位置居中，字体大小为30px */
    h2 {
      color: blue;
      text-align: center;
      font-size: 30px;
    }

    .h1 {
      /* 类名前面加. */
      color: rgb(125, 16, 34);
      text-align: center;
      font-size: 80px;
    }

    #d1 {
      /* id前面加# */
      color: rgb(142, 135, 136);
      text-align: center;
      font-size: 100px;
    }
  </style>
  <h1 id="d1" class="h1" style="text-align:center; color: pink" ;>hxc666</h1>
  <h2>daikun666</h2>
</body>

</html>
