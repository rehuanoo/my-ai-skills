<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      /* 前面加*表示所有，通用选择器 */
      /* 内外边框都为0 */
      margin: 0;
      padding: 0;
    }

    h1 {
      border: 1px solid red;
      border-radius: 10px;
      padding: 10px;
    }

    .error {
      color: red;
    }


    /* 团队约定少用甚至不使用id，通用选择器 ，div span*/
  </style>

</head>

<body>
  <h1>hxc666</h1>
  <div class="zu0 error">hello world</div>
  <p class="zu0">hello world</p>
</body>

</html>
