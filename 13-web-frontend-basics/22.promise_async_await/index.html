<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <p>Ajax</p>
  <script>

    function getAjax(url, callback, error) {


      // 创建ajax 对象
      var xhr = new XMLHttpRequest();
      // 设置请求地址和方法
      xhr.open('get', url);
      // 异步过程,js会继续运行其它代码
      // 监听请求状态
      xhr.onreadystatechange = function () {

        if (xhr.readyState === 4) {
          // 判断响应状态码是否为200，表示请求成功
          if (xhr.status === 200) {
            // 获取响应数据
            var data = xhr.responseText;
            // console.log(data);
            callback(xhr);
          } else {
            // 请求失败，调用error函数
            error(xhr);
          }
        }
      }

      // 发送请求
      xhr.send()

    }

    let urlStr = ('https://api.apiopen.top/api/tools/famous-sentence');


    function ajaxAsync(url) {
      return new Promise(function (resolve, reject) {

        var xhr = new XMLHttpRequest();
        // 设置请求地址和方法
        xhr.open('get', url);
        // 异步过程,js会继续运行其它代码
        // 监听请求状态
        xhr.onreadystatechange = function () {

          if (xhr.readyState === 4) {
            // 判断响应状态码是否为200，表示请求成功
            if (xhr.status === 200) {
              let data = JSON.parse(xhr.responseText)
              if (data.code === 200) {
                resolve(xhr);
              } else {
                reject('api出错了');
              }

              // 获取响应数据
              // var data = xhr.responseText;
              // console.log(data);

            } else {
              // 请求失败，调用error函数
              reject(xhr);
            }
          }
        }

        // 发送请求
        xhr.send()

      })
    }
    let p1 = ajaxAsync(urlStr);


    // 成功后做什么
    p1.then(function (xhr) {
      let data = JSON.parse(xhr.responseText);
      console.log(data);
      // 追加到文本
      let h1 = document.createElement('h1');
      h1.innerHTML = data.data.from
      let p = document.createElement('p');
      p.innerHTML = data.data.name
      document.body.appendChild(h1);
      document.body.appendChild(p);

    })

    // 失败后做什么
    p1.catch((err) => {
      console.log(err);
    })


  </script>
</body>

</html>
