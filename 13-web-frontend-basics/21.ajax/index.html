<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <p>Ajax</p>
  <script>

    function getAjax(url, callback, error) {


      // 创建ajax 对象
      var xhr = new XMLHttpRequest();
      // 设置请求地址和方法
      xhr.open('get', url);
      // 异步过程,js会继续运行其它代码
      // 监听请求状态
      xhr.onreadystatechange = function () {
        // console.log(xhr);
        // 0:请求未初始化
        // 1:请求已建立
        // 2:请求已发送
        // 3:请求处理中
        // 4:请求已完成，且响应已就绪(除了正常响应200，还有服务器错误404，403等,连接超时等)
        // console.log(xhr.readyState);
        // 判断请求是否完成，状态码为4，表示请求已经完成
        if (xhr.readyState === 4) {
          // 判断响应状态码是否为200，表示请求成功
          if (xhr.status === 200) {
            // 获取响应数据
            var data = xhr.responseText;
            // console.log(data);
            callback(xhr);
          } else {
            // 请求失败，调用error函数
            error(xhr);
          }
        }
      }

      // 发送请求
      xhr.send()

    }

    let urlStr = "https://api.timelessq.com/sentence"
    getAjax(urlStr, function (xhr) {
      // console.log(xhr.responseText);
      // 将json格式的字符串转换为js对象
      let data = JSON.parse(xhr.responseText);
      console.log(data);
      // 追加到文本
      let h1 = document.createElement('h1');
      h1.innerHTML = data.data.from + '<br>' + data.data.from_who
      let p = document.createElement('p');
      p.innerHTML = data.data.hitokoto
      document.body.appendChild(h1);
      document.body.appendChild(p);

    })
  </script>
</body>

</html>
