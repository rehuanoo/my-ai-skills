<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>按钮</button>
  <script>
    console.log(this);
    // 1. 全局作用域或者普通函数中，this指向全局对象window(在浏览器中)
    function test() {
      console.log('test', this);
    }
    test();



    // 2. 方法调用中，谁调用this指向谁
    var obj = {
      name: 'obj',
      sayHi: function () {
        console.log('sayHi', this);
      }

    }
    // this指向obj

    //3. 构造函数 new → this = 新创建的对象 → 赋值给实例
    function Person(name, age) {
      this.name = name;
      this.age = age;
    }
    var p1 = new Person('p1', 18);
    console.log(p1.name, p1.age);
    // 4. 箭头函数 this指向定义时所在的对象
    // 在箭头函数生成时this指向定义时所在的对象，而不是调用时所在的对象
    let btn = document.querySelector('button');
    btn.addEventListener('click', function () {
      console.log(this);
      setTimeout(() => {
        console.log(this);
        this.style.backgroundColor = 'red';
      }, 3000)
    })


  </script>
</body>

</html>
