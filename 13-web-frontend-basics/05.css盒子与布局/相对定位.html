<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .parent {

      width: 600px;
      height: 600px;
      border: 1px solid black;

    }

    .child1 {
      /* 相对定位 */
      width: 100px;
      height: 100px;
      background-color: red;
      position: relative;
      left: 50px;
      top: 50px;
      /* right: 50px;
      bottom: 50px; */
    }

    .child2 {

      width: 100px;
      height: 100px;
      background-color: blue;

    }

    .child3 {
      width: 100px;
      height: 100px;
      background-color: green;
    }
  </style>

</head>

<body>
  <div class="parent">
    <div class="child1">div1</div>
    <div class="child2">div2</div>
    <div class="child3">div3</div>

  </div>

</body>

</html>
