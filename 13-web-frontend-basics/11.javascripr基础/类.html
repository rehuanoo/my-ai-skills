<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    class student {
      constructor(name, age) {
        this.name = name;
        this.age = age;
      }
      say() {
        console.log(`我叫${this.name},今年${this.age}岁`);
      }

    }
    let s1 = new student("张三", 18);
    s1.say();

  </script>
</body>

</html>
