<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    function add1(a, b = 5) {
      console.log(a + b);
      return a + b;

    }
    add1(1, 2, 1, 5, 6);
    // 在js里这种不会报错，只取前两个参数，后面的参数会被忽略
    var add2 = function (a, b) {
      console.log(a + b);
      return a + b;
    }
    add2(1, 2);
    // 匿名函数赋值给变量，然后调用变量
    var add3 = (a, b) => {
      console.log(a + b);
      return a + b;
    }

  </script>
</body>

</html>
