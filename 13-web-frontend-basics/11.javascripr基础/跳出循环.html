<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    for (let i = 0; i < 10; i++) {
      console.log(i);
      if (i == 5) {
        break;//跳出整个循环
      }
    }
    for (let i = 0; i < 10; i++) {
      if (i == 5) {
        continue;//跳出本次循环
      }
      console.log(i);

    }
  </script>
</body>

</html>
